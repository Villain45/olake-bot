[project]
name = "olake-ask"
version = "0.1.0"
description = "Ask OLake: RAG chat assistant over the OLake docs and repos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "qdrant-client>=1.12",
  "fastembed>=0.4",
  "tokenizers>=0.20",
  "flashrank>=0.2.9",
  "ddgs>=9.0",
  "trafilatura>=2.0",
  "tenacity>=8.5",
  "cachetools>=5.4",
  "slowapi>=0.1.9",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false
